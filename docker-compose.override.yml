
 
services:
 

  fastapi:
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --reload-dir /app/config
      --log-level debug
    environment:
      APP_ENVIRONMENT: "staging"
      APP_DEBUG: "true"
      LOG_LEVEL: "DEBUG"
      #HF_HOME: "/cache/huggingface"
      FASTEMBED_CACHE_PATH: "/cache/fastembed"
      HOME: "/cache/fastembed"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./main.py:/app/main.py
      - ${DATA_ROOT}/uploads:/app/uploads
      - ${DATA_ROOT}/fastembed-cache:/cache/fastembed
    ports:
      - "8081:8000"
      - "5679:5678"
 

  celery-worker-high:
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --queues=high,shared_cleanup
      --concurrency=1
      --prefetch-multiplier=1
      --loglevel=debug
      --hostname=worker-high@%h
    environment:
      APP_ENVIRONMENT: "staging"
      LOG_LEVEL: "DEBUG"
      #HF_HOME: "/cache/huggingface"
      FASTEMBED_CACHE_PATH: "/cache/fastembed"
      HOME: "/cache/fastembed"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ${DATA_ROOT}/uploads:/app/uploads
      - ${DATA_ROOT}/fastembed-cache:/cache/fastembed
 

  celery-worker-default:
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --queues=default,low
      --concurrency=1
      --prefetch-multiplier=1
      --loglevel=debug
      --hostname=worker-default@%h
    environment:
      APP_ENVIRONMENT: "staging"
      LOG_LEVEL: "DEBUG"
      #HF_HOME: "/cache/huggingface"
      FASTEMBED_CACHE_PATH: "/cache/fastembed"
      HOME: "/cache/fastembed"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ${DATA_ROOT}/uploads:/app/uploads
      - ${DATA_ROOT}/fastembed-cache:/cache/fastembed


  celery-beat:
    environment:
      APP_ENVIRONMENT: "staging"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
 

  qdrant:
    environment:
      QDRANT__LOG_LEVEL: "WARN"
    ports:
      - "${IP_SERVER1}:6339:6333"  # 6333 x dev | 6334 x staging | 6335 x prod. cmnq ho io in development sta girando questo code, quindi la porta 6334 è gia occupata (sta girando gia il development environment, mentre here sto usando il staging environment)
      - "${IP_SERVER1}:6335:6334"  # NB: ports: e' una lista, Compose la SOSTITUISCE per intero rispetto a docker-compose.yml (non fa merge voce per voce) -- senza il bind qui, questo override rimetterebbe qdrant aperto su tutte le interfacce annullando il fix fatto nel file base
 

  redis:
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
 
 

  sqlserver:
    environment:
      MSSQL_MEMORY_LIMIT_MB: 2048


#ok

